[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rid2all"
version = "0.1.2"
description = "Remote ID to anything: DroneScout radio to SBS/tracking networks (wellclear.aero, readsb, tar1090, ultrafeeder)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WellClear contributors" }]
keywords = ["remote-id", "opendroneid", "dronescout", "sbs", "adsb", "readsb", "tar1090"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["pymavlink>=2.4", "pyserial>=3.5"]

[project.scripts]
rid2all = "rid2all.main:main"

[tool.setuptools]
packages = ["rid2all"]
