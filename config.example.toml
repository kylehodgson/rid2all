# rid2all configuration
# Copy to /etc/rid2all/config.toml (or pass -c).

[source]
# Serial device of the DroneScout bridge/receiver (USB-CDC shows up as ttyACM*)
device = "/dev/ttyACM0"
# DroneScout only supports 115200 for now
baud = 115200

[sbs]
# Serve SBS BaseStation locally — point readsb/ultrafeeder at this with
# --net-sbs-in-port (or READSB_NET_CONNECTOR / an mlathub SBS input).
[[sbs.listen]]
bind = "0.0.0.0"
port = 30003

# Push SBS out to aggregators. wellclear.aero's SBS ingest port will be
# published in the feeder docs; ADSB exchange-style networks that accept
# SBS push can be added the same way. Reconnects automatically.
#[[sbs.push]]
#host = "feed.wellclear.aero"
#port = 30006

#[[sbs.push]]
#host = "127.0.0.1"
#port = 30006

[track]
# Drop a track this many seconds after its last radio message
expire_seconds = 60
# Emit position (MSG,3/4) at most this often, per aircraft
position_interval = 1.0
# Re-send identification (MSG,1) this often (also on callsign change)
ident_interval = 30.0

[db]
# Write a readsb aircraft-database csv.gz (tar1090-db format) with an entry
# per detected Remote ID aircraft (type DRON/HRON) — this is what makes
# tar1090 show the drone icon and fill Type code / Reg. Point ultrafeeder's
# readsb at it with: READSB_EXTRA_ARGS=--db-file=/rid-db/db.csv.gz
# (share this directory with the ultrafeeder container, e.g. a named volume)
#output = "/rid-db/db.csv.gz"
# Optional: the standard tar1090-db aircraft.csv.gz to concatenate (keeps
# reg/type lookups for REAL aircraft on stations that also have an SDR).
# gzip streams concatenate, so this is a plain file cat, no decompression.
# Copy it out of the ultrafeeder image on the host:
#   docker cp ultrafeeder:/usr/local/share/tar1090/aircraft.csv.gz ./rid-db/base-aircraft.csv.gz
#base = "/rid-db/base-aircraft.csv.gz"

[log]
level = "info"
